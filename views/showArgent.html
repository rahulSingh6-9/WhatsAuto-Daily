<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renewal Reminder | WA Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<style>

/* ===== THEME VARIABLES ===== */

:root{
    --bg:#f0f2f5;
    --sidebar:#ffffff;
    --card:#ffffff;
    --text:#111b21;
    --subtext:#667781;
    --primary:#25D366;
    --hover:#e9edef;
}

[data-theme="dark"]{
    --bg:#0b141a;
    --sidebar:#111b21;
    --card:#202c33;
    --text:#e9edef;
    --subtext:#8696a0;
    --primary:#25D366;
    --hover:#2a3942;
}

/* ===== GLOBAL ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    display:flex;
    background:var(--bg);
    color:var(--text);
    transition:0.3s;
}

/* ================= SIDEBAR ================= */

.sidebar{
    width:250px;
    min-width:250px;   /* 🔥 VERY IMPORTANT */
    flex-shrink:0;     /* 🔥 prevents shrinking */
    background:var(--sidebar);
    padding:30px 20px;
    border-right:1px solid var(--hover);
    transition:0.3s;
}

.logo{
    font-size:20px;
    font-weight:600;
    color:var(--primary);
    margin-bottom:40px;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:15px;
}

.sidebar ul li a{
    text-decoration:none;
    color:var(--text);
    padding:12px 15px;
    display:block;
    border-radius:8px;
    transition:0.2s;
}

.sidebar ul li a:hover,
.sidebar ul li a.active{
    background:var(--primary);
    color:#fff;
}


/* ================= HEADER ================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.menu-toggle{
    display:none;
    background:var(--card);
    border:1px solid var(--hover);
    font-size:18px;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
}

/* ===== PROFILE IMAGE ===== */

.profile-img{
    width:36px;
    height:36px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--primary);
}

.sidebar-profile{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:30px;
}

.sidebar-profile img{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid var(--primary);
}

.sidebar-profile .name{
    font-size:14px;
    font-weight:500;
}
/* ===== CLOSE BTN ===== */

.close-btn{
    display:none;
    background:none;
    border:none;
    color:var(--text);
    font-size:18px;
    float:right;
    cursor:pointer;
}

/* ===== MAIN ===== */

.main{
    margin-left:40px;
    padding:40px;
    flex:1;          /* ✅ instead of width:100% */
}

/* ===== MENU BTN ===== */

.menu-btn{
    display:none;
    background:var(--primary);
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    margin-bottom:20px;
    color:white;
    font-size:13px;
}

/* ===== PAGE TITLE ===== */

h2{
    margin-bottom:30px;
}

/* ===== SECTION ===== */

.section{
    margin-bottom:50px;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-header h3{
    padding:8px 15px;
    border-radius:8px;
    font-size:14px;
    color:white;
}

.days30{ background:#1e90ff; }
.days60{ background:#ffa500; }
.days90{ background:#ff3b3b; }

/* ===== COPY BUTTON ===== */

.copy-btn{
    padding:6px 12px;
    border:none;
    border-radius:20px;
    background:white;
    color:black;
    cursor:pointer;
    font-size:12px;
    transition:0.2s;
}

.copy-btn:hover{
    color: white;
    background:#087617;
}
.copy-btn:active{
    color: white;
    transform: scale(1.1);
}

/* ===== TABLE ===== */

table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border-radius:12px;
    overflow:hidden;
    border:1px solid var(--hover);
}

th, td{
    padding:12px;
    text-align:left;
}

th{
    color:var(--primary);
    border-bottom:1px solid var(--hover);
}

tr{
    border-bottom:1px solid var(--hover);
}

tr:hover{
    background:var(--hover);
}

/* ===== STATUS ===== */

.stage{
    padding:5px 10px;
    border-radius:6px;
    font-size:12px;
}

.active{
    background:var(--primary);
    color:white;
}

.stop{
    background:#ff4d4d;
    color:white;
}

/* ===== MOBILE ===== */

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    z-index:1000;
}

.overlay.active{
    display:block;
}

@media(max-width:768px){

    .sidebar{
        left:-260px;
    }

    .sidebar.active{
        left:0;
    }

    .close-btn{
        display:block;
    }

    .main{
        margin-left:0;
        padding:20px;
    }

    .menu-btn{
        display:inline-block;
    }

    .copy-btn{
        width:auto;     /* NOT full width */
        font-size:11px;
        padding:5px 10px;
    }
}

</style>
</head>

<body>

<div class="overlay" onclick="toggleSidebar()"></div>

<div class="sidebar">
    <div class="sidebar-profile">
    <img src="https://i.pravatar.cc/100?img=12" alt="Rahul">
    <div>
        <div class="logo" style="margin-bottom:2px;">WA Admin</div>
        <div class="name">Rahul</div>
    </div>
</div>
    <ul>
        <li><a href="/admin">Dashboard</a></li>
        <li><a href="/showArgent" class="active">Show Argent</a></li>
        <li><a href="/chats">Chats</a></li>
        <li><a href="#">Scheduled</a></li>
        <li><a href="#">Settings</a></li>
    </ul>
</div>

<div class="main">

    <button class="menu-btn" onclick="toggleSidebar()">☰ Menu</button>

    <h2>🔔 Renewal Reminder Dashboard</h2>

    <!-- 30 -->
    <div class="section">
        <div class="section-header">
            <h3 class="days30">30 Days Completed</h3>
            <button class="copy-btn" onclick="copyClients('table30')">Copy All</button>
        </div>
        <table id="table30">
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Status</th>
                <th>Start Date</th>
            </tr>
            <tbody id="body30"></tbody>
        </table>
    </div>

    <!-- 60 -->
    <div class="section">
        <div class="section-header">
            <h3 class="days60">60 Days Completed</h3>
            <button class="copy-btn" onclick="copyClients('table60')">Copy All</button>
        </div>
        <table id="table60">
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Status</th>
                <th>Start Date</th>
            </tr>
            <tbody id="body60"></tbody>
        </table>
    </div>

    <!-- 90 -->
    <div class="section">
        <div class="section-header">
            <h3 class="days90">90 Days Completed (URGENT)</h3>
            <button class="copy-btn" onclick="copyClients('table90')">Copy All</button>
        </div>
        <table id="table90">
            <tr>
                <th>S.No</th>
                <th>Name</th>
                <th>Status</th>
                <th>Start Date</th>
            </tr>
            <tbody id="body90"></tbody>
        </table>
    </div>

</div>

<script>

/* ===== APPLY DARK MODE FROM ADMIN ===== */
window.addEventListener("DOMContentLoaded",()=>{
    const saved = localStorage.getItem("theme")
    if(saved==="dark"){
        document.body.setAttribute("data-theme","dark")
    }
})

/* ===== YOUR ORIGINAL JS (UNCHANGED) ===== */

function toggleSidebar(){
    document.querySelector('.sidebar').classList.toggle('active');
    document.querySelector('.overlay').classList.toggle('active');
}

const days30 = document.getElementById('body30')
const days60 = document.getElementById('body60')
const days90 = document.getElementById('body90')

function renderTables(data30, data60, data90) {
    days30.innerHTML = ''
    days60.innerHTML = ''
    days90.innerHTML = ''

    data30.forEach(c => {
        days30.innerHTML += `
        <tr>
            <td>${c.id}</td>
            <td>${c.name}</td>
            <td>
                <span class="stage ${c.status === 'Active' ? 'active' : 'stop'}">
                    ${c.status}
                </span>
            </td>
            <td>${c.date}</td>
        </tr>`
    })
    data60.forEach(c => {
        days60.innerHTML += `
        <tr>
          <td>${c.id}</td>
                <td>${c.name}</td>
                <td>
                    <span class="stage ${c.status === 'Active' ? 'active' : 'stop'}">
                        ${c.status}
                    </span>
                </td>
                <td>${c.date}</td>
        </tr>`
    })
    data90.forEach(c => {
        days90.innerHTML += `
        <tr>
          <td>${c.id}</td>
                <td>${c.name}</td>
                <td>
                    <span class="stage ${c.status === 'Active' ? 'active' : 'stop'}">
                        ${c.status}
                    </span>
                </td>
                <td>${c.date}</td>
        </tr>`
    })

}

async function loadClients(){
    try{
        const res1 = await fetch('/api/getclients30')
        const res2 = await fetch('/api/getclients60')
        const res3 = await fetch('/api/getclients90')

        const clients30 = await res1.json()
        const clients60 = await res2.json()
        const clients90 = await res3.json()

        renderTables(clients30, clients60, clients90)
    } catch(err){
        console.log('Error loading clients:', err)
    }
}

function copyClients(tableId){
    const table = document.getElementById(tableId);
    let text = "";
    for(let i=1; i<table.rows.length; i++){
        let row = table.rows[i];
        text += row.cells[0].innerText + " - " +
                row.cells[1].innerText + " - " +
                row.cells[2].innerText + "\n";
    }
    navigator.clipboard.writeText(text);
}

loadClients()

</script>

</body>
</html>
